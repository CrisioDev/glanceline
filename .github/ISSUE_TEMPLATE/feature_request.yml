name: Feature request
description: Suggest an idea for Glanceline
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please check the [roadmap](https://github.com/CrisioDev/glanceline/blob/main/ROADMAP.md) first – maybe it's already planned. Deutsch ist auch okay.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation on stream or on stage where you miss something.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
