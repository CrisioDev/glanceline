# Baut Glanceline auf macOS (Apple Silicon) und startet einen Rauchtest mit Screenshots.
# Manuell (Actions → macOS → Run workflow) oder bei Versions-Tags.
name: macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Checks
        run: |
          npm run check:i18n
          for f in main.js server/*.js public/*.js tools/*.js; do node --check "$f"; done
          # JXA-Brücke für Keynote/PowerPoint muss kompilieren
          osacompile -l JavaScript -o "$RUNNER_TEMP/mac-slides.scpt" server/mac-slides.js

      - name: Smoke test (app starts, panel and prompter render, no console errors)
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/snap"
          echo '{"general":{"setupDone":true,"language":"en"}}' > "$RUNNER_TEMP/data/settings.json"
          GLANCELINE_DATA="$RUNNER_TEMP/data" GLANCELINE_NO_MIC=1 npx electron . --snapshot "$RUNNER_TEMP/snap" \
            --snapshot-steps "wait3000,chat:demo,wait3000,mode:chat,mode:script,script:play,wait1500,tab:live,tab:scripts,tab:settings,live:end"
          ls "$RUNNER_TEMP/snap"
          node -e "
            const fs = require('fs'); const d = process.env.RUNNER_TEMP + '/snap';
            const log = fs.readFileSync(d + '/console.log', 'utf8');
            const errors = log.split('\\n').filter((l) => /error/i.test(l));
            const live = JSON.parse(fs.readFileSync(d + '/live-end.json', 'utf8')).live;
            console.log('Prompter:', live.prompter.kind, '| fonts check skipped | errors:', errors.length);
            if (errors.length) { console.log(errors.join('\\n')); process.exit(1); }
            if (!fs.existsSync(d + '/panel-live.png') || !fs.existsSync(d + '/prompter-mode-chat.png')) process.exit(1);
          "

      - name: Fonts and slides bridge
        run: |
          node -e "require('./server/fonts').systemFonts().then((f) => { console.log(f.length + ' fonts, e.g. ' + f.slice(0, 5).join(', ')); if (f.length < 20) process.exit(1); })"
          # Brücke kurz laufen lassen: ohne Keynote/PowerPoint muss sie „nicht offen“ melden
          (osascript -l JavaScript server/mac-slides.js > "$RUNNER_TEMP/bridge.txt" 2>&1 &) ; sleep 4 ; pkill -f mac-slides.js || true
          cat "$RUNNER_TEMP/bridge.txt"
          grep -q '"running":false' "$RUNNER_TEMP/bridge.txt"

      - name: Build (unsigned)
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glanceline-mac
          path: |
            dist/*.dmg
            ${{ runner.temp }}/snap/*.png
            ${{ runner.temp }}/snap/console.log
          retention-days: 7
